modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
#issueTrackerURL = ""
license = "${license}"

[[mods]]
modId = "naraka"
version = "${version}"
displayName = "Naraka"
authors = "${mod_author}"
credits = "${credits}"
description = '''${description}'''
logoFile = "naraka.png"
displayURL = "https://github.com/lalaalal/Naraka"

[[dependencies.naraka]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.naraka]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "naraka.mixins.json"

[[mixins]]
config = "naraka.mixins.neoforge.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"


