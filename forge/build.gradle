import com.hypherionmc.modpublisher.properties.ModLoader

plugins {
    id 'com.github.johnrengelman.shadow'
    id "com.hypherionmc.modutils.modpublisher" version "2.1.7"
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {

}

dependencies {
    forge "net.minecraftforge:forge:${project.forge_version}"

    implementation "io.github.llamalad7:mixinextras-forge:0.5.4"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.4"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

loom {
    forge {
        mixinConfig "naraka.mixins.forge.json"
    }
    runs {
        data {
            data()
            programArgs "--all", "--mod", "$project.mod_id"
            programArgs "--output", file("src/main/generated.forge").absolutePath
            programArgs "--existing", file("src/main/resources").absolutePath
        }
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

sourceSets.main.resources {
    srcDirs project(':fabric').file('src/main/generated'), 'src/main/generated.forge'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

publisher {
    setupPublisher()
    setLoaders(ModLoader.FORGE)
}
