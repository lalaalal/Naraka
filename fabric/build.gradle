import com.hypherionmc.modpublisher.properties.ModLoader

plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    implementation 'com.google.code.findbugs:jsr305:3.0.2'

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modImplementation "maven.modrinth:jade:${jade_version}+fabric"
    modImplementation "maven.modrinth:modmenu:${modmenu_version}"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
}

loom {
    def aw = file("src/main/resources/${mod_id}.fabric.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client ${minecraft_version}")
            ideConfigGenerated(true)
            runDir("run/${minecraft_version}")
            programArgs('--username', System.getProperty("user.name"))
        }
        server {
            server()
            setConfigName("Fabric Server ${minecraft_version}")
            ideConfigGenerated(true)
            runDir("run/${minecraft_version}")
        }
        datagen {
            inherit client
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"
            setConfigName("Fabric Data ${minecraft_version}")
            ideConfigGenerated(true)
            runDir("run/data")
        }
    }
}

publisher {
    setLoaders(ModLoader.FABRIC)

    modrinthDepends {
        required "fabric-api"
    }

    curseDepends {
        required "fabric-api"
    }
}
