import com.hypherionmc.modpublisher.properties.ModLoader

plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "maven.modrinth:jade:${jade_version}+fabric"
    implementation "maven.modrinth:modmenu:${modmenu_version}"
    implementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
}

loom {
    def aw = file("src/main/resources/${mod_id}.fabric.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client ${minecraft_version}")
            ideConfigGenerated(true)
            runDir("run/${minecraft_version}")
            programArgs('--username', System.getProperty("user.name"))
        }
        server {
            server()
            setConfigName("Fabric Server ${minecraft_version}")
            ideConfigGenerated(true)
            runDir("run/${minecraft_version}")
        }
        datagen {
            inherit client
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"
            setConfigName("Fabric Data ${minecraft_version}")
            ideConfigGenerated(true)
            runDir("run/${minecraft_version}")
        }
    }
}

publisher {
    setLoaders(ModLoader.FABRIC)

    modrinthDepends {
        required "fabric-api"
    }

    curseDepends {
        required "fabric-api"
    }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}